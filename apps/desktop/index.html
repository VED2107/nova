<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA</title>
    <style>
      /* Starting logo: drawn before any script runs, removed once the app has painted (main.tsx). */
      #boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #171715; transition: opacity 320ms ease-in; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .mark { display: grid; justify-items: center; gap: 22px; }
      #boot svg { width: 120px; height: 120px; display: block; }
      #boot .track { width: 86px; height: 2px; border-radius: 1px; background: rgba(247, 244, 238, 0.14); overflow: hidden; }
      #boot .rule { height: 100%; width: 100%; background: #f97316; transform-origin: left; animation: nova-scrub 620ms cubic-bezier(0.65, 0, 0.35, 1) 160ms both; }
      #boot .stroke { animation: nova-stroke 420ms cubic-bezier(0.33, 1, 0.68, 1) both; }
      @keyframes nova-scrub { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes nova-stroke { from { opacity: 0; transform: translate(-6px, -22px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot .rule, #boot .stroke { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="NOVA is starting">
      <div class="mark">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path d="M40 40h32v176h-32zM184 40h32v176h-32z" fill="#F7F4EE" />
          <path class="stroke" d="M82 40h44L174 216h-44z" fill="#F97316" />
        </svg>
        <div class="track"><div class="rule"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
