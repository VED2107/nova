[package]
name = "nova-desktop"
version = "0.1.0"
description = "NOVA media player desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
nova-application.workspace = true
nova-domain.workspace = true
nova-playback-api.workspace = true
nova-playback-mpv.workspace = true
nova-storage.workspace = true
nova-library.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
