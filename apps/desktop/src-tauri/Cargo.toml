[package]
name = "nova-desktop"
version = "0.3.0"
description = "NOVA media player desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
nova-application.workspace = true
nova-domain.workspace = true
nova-playback-api.workspace = true
nova-playback-mpv.workspace = true
nova-storage.workspace = true
nova-library.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
