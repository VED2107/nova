[workspace]
resolver = "3"
members = [
    "crates/nova-application",
    "crates/nova-domain",
    "crates/nova-library",
    "crates/nova-playback-api",
    "crates/nova-playback-mpv",
    "crates/nova-storage",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false
# Application-layer license is not yet decided; see docs/adr/0003-libmpv-distribution-and-licensing.md.
license = "UNLICENSED"

[workspace.dependencies]
nova-application = { path = "crates/nova-application" }
nova-domain = { path = "crates/nova-domain" }
nova-library = { path = "crates/nova-library" }
nova-playback-api = { path = "crates/nova-playback-api" }
nova-playback-mpv = { path = "crates/nova-playback-mpv" }
nova-storage = { path = "crates/nova-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
log = "0.4"

[profile.dev.package."*"]
opt-level = 1
